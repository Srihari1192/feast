apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: test-ns-feast
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: 'quay.io/sclorg/redis-7-c9s@sha256:d772acab11507231a2b152850f47c8b9b859dedb6652ca624949e97cb28c5e6f'
          ports:
            - containerPort: 6379
          env:
          - name: ALLOW_EMPTY_PASSWORD
            value: "yes"
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: test-ns-feast
  labels:
    app: redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
  selector:
    app: redis
