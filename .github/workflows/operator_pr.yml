name: operator-pr

on: [pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  operator-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.24.12
      - name: Operator tests
        run: make -C infra/feast-operator test
        # make test already writes infra/feast-operator/cover.out via:
        #   go test ... -coverprofile cover.out
      - name: Upload Operator coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./infra/feast-operator/cover.out
          flags: go-operator
          fail_ci_if_error: false
          verbose: true
      - name: After code formatting, check for uncommitted differences
        run: git diff --exit-code infra/feast-operator
