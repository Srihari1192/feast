# Build/push Feast CI test images (no Go toolchain needed at test time).
# Source is always latest tip of feast master + feast-module-operator main.
# Version input only controls the Quay tag names (existing tags are overwritten).
#
# Produces per version:
#   feast-{v}, feast-operator-{v}, feast-module-operator-{v}
#
# Secrets: QUAYIO_CI_USERNAME, QUAYIO_CI_TOKEN (feastdev-ci)
# Optional: SYNC_STABLE_PAT (private module checkout)
name: build-feast-test-images

on:
  workflow_dispatch:
    inputs:
      feast_versions:
        description: >
          Comma-separated tags to push (override if tag exists).
          Accepts "3.6,3.7,3.8" or "feast-3.6,feast-3.7".
          Source code is always feast master + module-operator main.
        required: true
        type: string
        default: "3.6,3.7"
      module_repo:
        description: Module operator GitHub repo (owner/name)
        required: false
        type: string
        default: opendatahub-io/feast-module-operator
      components:
        description: >
          What to build. "all" or CSV of:
          feast, feast-operator, feast-module-operator
        required: true
        type: string
        default: all
      platforms:
        description: buildx platforms
        required: false
        type: string
        default: linux/amd64

permissions:
  contents: read

concurrency:
  group: feast-test-images-${{ github.workflow }}-${{ github.event.inputs.feast_versions }}
  cancel-in-progress: false

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.gen.outputs.include }}
    steps:
      - id: gen
        shell: bash
        run: |
          set -euo pipefail

          # Normalize "feast-3.6, 3.7, feast-3.8" → versions 3.6 3.7 3.8
          normalize_version() {
            local raw
            raw="$(echo "$1" | xargs)"
            raw="${raw#feast-}"
            raw="${raw#FEAST-}"
            echo "${raw}"
          }

          versions_csv="${{ github.event.inputs.feast_versions }}"
          components_csv="${{ github.event.inputs.components }}"

          if [[ "${components_csv}" == "all" ]]; then
            components_csv="feast,feast-operator,feast-module-operator"
          fi

          IFS=',' read -ra RAW_VERSIONS <<< "${versions_csv}"
          IFS=',' read -ra COMPONENTS <<< "${components_csv}"

          include='[]'
          for raw in "${RAW_VERSIONS[@]}"; do
            version="$(normalize_version "${raw}")"
            [[ -z "${version}" ]] && continue

            for component in "${COMPONENTS[@]}"; do
              component="$(echo "${component}" | xargs)"
              [[ -z "${component}" ]] && continue
              case "${component}" in
                feast|feast-operator|feast-module-operator) ;;
                *) echo "Unknown component: ${component}" >&2; exit 1 ;;
              esac
              include=$(jq -c \
                --arg version "${version}" \
                --arg component "${component}" \
                '. + [{version:$version, component:$component}]' \
                <<< "${include}")
            done
          done

          if [[ "${include}" == "[]" ]]; then
            echo "No versions/components to build" >&2
            exit 1
          fi

          echo "include=${include}" >> "$GITHUB_OUTPUT"
          echo "Generated matrix: ${include}"

  build-push:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    env:
      QUAY_REPO: quay.io/feastdev-ci/feast-test-images
      PLATFORMS: ${{ github.event.inputs.platforms }}
      MODULE_REPO: ${{ github.event.inputs.module_repo }}
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false
          tool-cache: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Login to Quay.io (feastdev-ci)
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAYIO_CI_USERNAME }}
          password: ${{ secrets.QUAYIO_CI_TOKEN }}

      - name: Resolve target tag (override if exists)
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.component }}" in
            feast) tag="feast-${{ matrix.version }}" ;;
            feast-operator) tag="feast-operator-${{ matrix.version }}" ;;
            feast-module-operator) tag="feast-module-operator-${{ matrix.version }}" ;;
          esac
          image="${QUAY_REPO}:${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

          if docker manifest inspect "${image}" >/dev/null 2>&1; then
            echo "Tag ${image} already exists on Quay — will rebuild and overwrite."
            echo "override=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag ${image} does not exist yet — will create."
            echo "override=false" >> "$GITHUB_OUTPUT"
          fi

      # ── feast / feast-operator (always master) ─────────────────────
      - name: Checkout feast master
        if: matrix.component == 'feast' || matrix.component == 'feast-operator'
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
          path: feast

      - name: Record feast HEAD
        if: matrix.component == 'feast' || matrix.component == 'feast-operator'
        working-directory: feast
        shell: bash
        run: |
          set -euo pipefail
          echo "feast_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "feast HEAD=$(git rev-parse --short HEAD) branch=$(git rev-parse --abbrev-ref HEAD)"

      - name: Build/push feast-{version} (feature-server)
        if: matrix.component == 'feast'
        uses: docker/build-push-action@v6
        with:
          context: feast
          file: feast/sdk/python/feast/infra/feature_servers/multicloud/Dockerfile
          push: true
          platforms: ${{ env.PLATFORMS }}
          tags: |
            ${{ steps.tag.outputs.image }}
            ${{ env.QUAY_REPO }}:feast-${{ matrix.version }}-${{ github.run_id }}
          provenance: false

      - name: Build/push feast-operator-{version}
        if: matrix.component == 'feast-operator'
        uses: docker/build-push-action@v6
        with:
          context: feast/infra/feast-operator
          file: feast/infra/feast-operator/Dockerfile
          push: true
          platforms: ${{ env.PLATFORMS }}
          tags: |
            ${{ steps.tag.outputs.image }}
            ${{ env.QUAY_REPO }}:feast-operator-${{ matrix.version }}-${{ github.run_id }}
          provenance: false

      # ── feast-module-operator (always main) ──────────────────────────
      - name: Checkout feast-module-operator main
        if: matrix.component == 'feast-module-operator'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MODULE_REPO }}
          ref: main
          fetch-depth: 1
          path: feast-module-operator
          token: ${{ secrets.SYNC_STABLE_PAT != '' && secrets.SYNC_STABLE_PAT || github.token }}

      - name: Record module HEAD
        if: matrix.component == 'feast-module-operator'
        working-directory: feast-module-operator
        shell: bash
        run: |
          set -euo pipefail
          echo "module_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "module HEAD=$(git rev-parse --short HEAD) branch=$(git rev-parse --abbrev-ref HEAD)"

      - name: Prepare module manifests
        if: matrix.component == 'feast-module-operator'
        working-directory: feast-module-operator
        run: make container-prep

      - name: Build/push feast-module-operator-{version}
        if: matrix.component == 'feast-module-operator'
        uses: docker/build-push-action@v6
        with:
          context: feast-module-operator
          file: feast-module-operator/Containerfile
          push: true
          platforms: ${{ env.PLATFORMS }}
          tags: |
            ${{ steps.tag.outputs.image }}
            ${{ env.QUAY_REPO }}:feast-module-operator-${{ matrix.version }}-${{ github.run_id }}
          provenance: false

      - name: Summary
        shell: bash
        run: |
          {
            echo "### feast-test-images"
            echo "- component: \`${{ matrix.component }}\`"
            echo "- tag: \`${{ steps.tag.outputs.tag }}\`"
            echo "- image: \`${{ steps.tag.outputs.image }}\`"
            echo "- override existing: \`${{ steps.tag.outputs.override }}\`"
            echo "- source: feast \`master\` / module-operator \`main\` (latest tip)"
            echo "- feast_sha: \`${{ env.feast_sha }}\`"
            echo "- module_sha: \`${{ env.module_sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
