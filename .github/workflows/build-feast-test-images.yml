# Build/push combined Feast e2e test image (no Go toolchain at test time).
#
#   quay.io/feastdev-ci/feast-test-images:feast-{tag}
#
# Image contains precompiled binaries for:
#   - feast-module-operator e2e
#   - feast-operator e2e + e2e_rhoai
# Select suite at runtime with FEAST_TEST=module-operator|operator-e2e|operator-e2e-rhoai
#
# Dockerfile: infra/feast-operator/test/e2e_rhoai/hack/feast-test-images/Dockerfile.e2e-test
# Source branches are configurable (defaults: feast master, module main).
#
# Secrets: QUAYIO_CI_USERNAME, QUAYIO_CI_TOKEN
# Optional: SYNC_STABLE_PAT (private module checkout)
name: Build and Push Feast test images

on:
  workflow_dispatch:
    inputs:
      feast_rhoai_release_tag:
        description: >
          Feast RHOAI release version, e.g. 3.6 (one tag per run).
          Pushes quay.io/feastdev-ci/feast-test-images:feast-<version>
          (overwrites existing tag).
        required: true
        type: string
        default: "3.6"
      feast_repo:
        description: >
          GitHub repo (owner/name) with feast-operator e2e sources.
          Default opendatahub-io/feast; use a fork if needed.
        required: false
        type: string
        default: opendatahub-io/feast
      feast_branch:
        description: >
          Branch, tag, or SHA on feast_repo to build from (default master).
        required: false
        type: string
        default: master
      module_repo:
        description: >
          GitHub repo (owner/name) with feast-module-operator e2e sources.
          Default opendatahub-io/feast-module-operator.
        required: false
        type: string
        default: opendatahub-io/feast-module-operator
      module_branch:
        description: >
          Branch, tag, or SHA on module_repo to build from (default main).
        required: false
        type: string
        default: main

permissions:
  contents: read

concurrency:
  group: feast-test-images-${{ github.workflow }}-${{ github.event.inputs.feast_rhoai_release_tag }}
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-latest
    env:
      QUAY_REPO: quay.io/feastdev-ci/feast-test-images
      FEAST_REPO: ${{ github.event.inputs.feast_repo }}
      FEAST_BRANCH: ${{ github.event.inputs.feast_branch }}
      MODULE_REPO: ${{ github.event.inputs.module_repo }}
      MODULE_BRANCH: ${{ github.event.inputs.module_branch }}
      IMAGE_DIR: workflow/infra/feast-operator/test/e2e_rhoai/hack/feast-test-images
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false
          tool-cache: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAYIO_CI_USERNAME }}
          password: ${{ secrets.QUAYIO_CI_TOKEN }}

      - name: Checkout workflow repo (Dockerfile)
        uses: actions/checkout@v4
        with:
          path: workflow
          fetch-depth: 1

      - name: Checkout feast (operator e2e source)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FEAST_REPO }}
          ref: ${{ env.FEAST_BRANCH }}
          path: feast
          fetch-depth: 1

      - name: Checkout feast-module-operator
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MODULE_REPO }}
          ref: ${{ env.MODULE_BRANCH }}
          path: feast-module-operator
          fetch-depth: 1
          token: ${{ secrets.SYNC_STABLE_PAT != '' && secrets.SYNC_STABLE_PAT || github.token }}

      - name: Normalize version tag
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          raw="$(echo "${{ github.event.inputs.feast_rhoai_release_tag }}" | xargs)"
          raw="${raw#feast-}"
          raw="${raw#FEAST-}"
          if [[ -z "${raw}" || "${raw}" == *","* ]]; then
            echo "Provide a single RHOAI version (e.g. 3.6), not a comma-separated list." >&2
            exit 1
          fi
          echo "version=${raw}" >> "$GITHUB_OUTPUT"
          echo "Building feast-${raw}"

      - name: Record SHAs
        shell: bash
        run: |
          set -euo pipefail
          echo "feast_sha=$(git -C feast rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "module_sha=$(git -C feast-module-operator rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "feast ${FEAST_REPO}@${FEAST_BRANCH} HEAD=$(git -C feast rev-parse --short HEAD)"
          echo "module ${MODULE_REPO}@${MODULE_BRANCH} HEAD=$(git -C feast-module-operator rev-parse --short HEAD)"

      - name: Resolve feast-{version} tag (always overwrite)
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          combined="${QUAY_REPO}:feast-${{ steps.ver.outputs.version }}"
          echo "combined=${combined}" >> "$GITHUB_OUTPUT"
          if docker manifest inspect "${combined}" >/dev/null 2>&1; then
            echo "Tag ${combined} exists — will overwrite."
            echo "override=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag ${combined} is new."
            echo "override=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build/push feast-{version}
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.IMAGE_DIR }}
          file: ${{ env.IMAGE_DIR }}/Dockerfile.e2e-test
          build-contexts: |
            module=feast-module-operator
            operator=feast/infra/feast-operator
          push: true
          tags: ${{ steps.tags.outputs.combined }}
          provenance: false

      - name: Summary
        shell: bash
        run: |
          {
            echo "### feast e2e image"
            echo "- pushed: \`${{ steps.tags.outputs.combined }}\`"
            echo "- override existing: \`${{ steps.tags.outputs.override }}\`"
            echo "- feast: \`${{ env.FEAST_REPO }}\` @ \`${{ env.FEAST_BRANCH }}\` (\`${{ env.feast_sha }}\`)"
            echo "- module: \`${{ env.MODULE_REPO }}\` @ \`${{ env.MODULE_BRANCH }}\` (\`${{ env.module_sha }}\`)"
            echo ""
            echo "Run module suite:"
            echo '```'
            echo "docker run --rm -e KUBECONFIG=/kubeconfig -v \"\$KUBECONFIG:/kubeconfig:ro\" \\"
            echo "  -e FEAST_TEST=module-operator \\"
            echo "  ${{ steps.tags.outputs.combined }} -test.v"
            echo '```'
            echo "Run feast-operator e2e:"
            echo '```'
            echo "docker run --rm -e KUBECONFIG=/kubeconfig -v \"\$KUBECONFIG:/kubeconfig:ro\" \\"
            echo "  -e FEAST_TEST=operator-e2e -e RUN_ON_OPENSHIFT_CI=1 \\"
            echo "  ${{ steps.tags.outputs.combined }} -test.v"
            echo '```'
            echo "Run feast-operator e2e_rhoai:"
            echo '```'
            echo "docker run --rm -e KUBECONFIG=/kubeconfig -v \"\$KUBECONFIG:/kubeconfig:ro\" \\"
            echo "  -e FEAST_TEST=operator-e2e-rhoai \\"
            echo "  ${{ steps.tags.outputs.combined }} -test.v"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
