name: build and publish test images

on:
  workflow_dispatch:
    inputs:
      redis_tag:
        description: 'Redis image tag to publish (e.g., redis-latest, redis-7)'
        required: false
        default: 'redis-latest'
  push:
    branches:
      - master
    paths:
      - 'infra/feast-operator/test/testdata/feast_integration_test_crs/redis/Dockerfile'
      - '.github/workflows/build_test_images.yml'

env:
  REGISTRY: quay.io/feastdev-ci/feast-test-images

jobs:
  build-redis-test-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_CI_USERNAME }}
          password: ${{ secrets.QUAY_CI_PASSWORD }}

      - name: Build and push multi-arch Redis image
        uses: docker/build-push-action@v5
        with:
          context: infra/feast-operator/test/testdata/feast_integration_test_crs/redis
          file: infra/feast-operator/test/testdata/feast_integration_test_crs/redis/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/ppc64le,linux/s390x
          push: true
          tags: |
            ${{ env.REGISTRY }}:${{ inputs.redis_tag || 'redis-latest' }}
            ${{ env.REGISTRY }}:redis-${{ github.sha }}
