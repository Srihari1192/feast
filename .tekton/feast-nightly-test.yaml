---
# Feast Nightly Integration Test (Pipelines-as-Code)
#
# Runs the full Feast integration test suite on a nightly schedule against
# the latest master branch images. Provisions an ephemeral HyperShift cluster,
# deploys feast-operator and feature-server, and runs e2e + REST API +
# upgrade tests.
#
# Triggers:
#   - Cron: Every day at 8:00 AM IST (2:30 AM UTC)
#   - Comment: /nightly-test on a pull request (manual trigger)
#
# Pipeline definition: Srihari1192/odh-konflux-central
#   integration-tests/feast/nightly-testing-pipeline.yaml
#
# Components tested: odh-feast-operator-ci, odh-feature-server-ci
#
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/Srihari1192/feast?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "5"
    # Nightly schedule: every day at 8:00 AM IST (2:30 AM UTC)
    pipelinesascode.tekton.dev/on-cron: "30 2 * * *"
    # Also allow manual trigger via PR comment
    pipelinesascode.tekton.dev/on-comment: "^/nightly-test"
    # Target the master branch
    pipelinesascode.tekton.dev/target-branch: "master"
  name: feast-nightly-test
  namespace: open-data-hub-tenant
  labels:
    appstudio.openshift.io/application: group-testing
    appstudio.openshift.io/component: feast-nightly
    pipelines.appstudio.openshift.io/type: test
spec:
  params:
  - name: group-components
    value: '{ "odh-feast-operator-ci": "opendatahub/feast-operator", "odh-feature-server-ci": "opendatahub/feature-server" }'
  # Report nightly results as commit status + issue on this repo/branch
  - name: git-repo
    value: 'Srihari1192/feast'
  - name: git-branch
    value: 'master'
  pipelineRef:
    resolver: git
    params:
    # Points to fork's odh-konflux-central for testing
    - name: url
      value: https://github.com/Srihari1192/odh-konflux-central.git
    - name: revision
      value: feat/feast-nightly-pipeline
    - name: pathInRepo
      value: integration-tests/feast/nightly-testing-pipeline.yaml
  taskRunTemplate:
    podTemplate:
      nodeSelector:
        konflux-ci.dev/workload: konflux-tenants
      tolerations:
      - effect: NoSchedule
        key: konflux-ci.dev/workload
        operator: Equal
        value: konflux-tenants
    serviceAccountName: konflux-integration-runner
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
